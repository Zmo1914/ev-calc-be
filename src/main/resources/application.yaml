server:
  port: ${SERVER_PORT:8084}
  compression.enabled: true

springdoc:
  enable-hateoas: false
  enable-data-rest: false
  api-docs:
    version: openapi_3_1
    path: /api-docs
  swagger-ui:
    display-request-duration: true
    #    groups-order: DESC
    operationsSorter: method
    tagsSorter: alpha
    use-root-path: true
    path: /swagger-ui
#    disable-swagger-default-url: true
#  show-actuator: true
#  group-configs:
#    - group: stores
#      paths-to-match: /store/**
#  cache:
#    disabled: true

#logging.level:
#  org.springframework:
#    web: INFO
#    security: WARN
#    boot.autoconfigure: INFO
#  bg.bulsi.nea: INFO
logging.level:
  root: INFO
  org.springframework:
    web: INFO
    security: INFO
  org.hibernate: DEBUG
  org.hibernate.stat: DEBUG
  bg.bulsi.nea: DEBUG

spring:
  threads.virtual.enabled: true
  data.rest.max-page-size: 5000
  web:
    resources:
      # Disables automatic mapping of static resources from locations like /static, /public, /resources or /META-INF/resources
      add-mappings: false
  jackson.default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
