spring:
  application:
    name: ev-calc-be
  datasource:
    url: jdbc:h2:file:./data/evsplitter
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
